<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>✨ Creative Hub</h1>
        <p>Your all-in-one creative workspace.</p>

        <div class="dashboard">

            <div class="card">
                <h2>🎨 2D Images</h2>
                <p>Create and edit 2D images.</p>
                <button onclick="open2D()">Open</button>
            </div>

            <div class="card">
                <h2>🧊 3D Creator</h2>
                <p>Create 3D objects and scenes.</p>
                <button>Open</button>
            </div>

            <div class="card">
                <h2>🎮 Game Creator</h2>
                <p>Build games and projects.</p>
                <button>Open</button>
            </div>

            <div class="card">
                <h2>🌐 Website Builder</h2>
                <p>Create your own websites.</p>
                <button>Open</button>
            </div>

            <div class="card">
                <h2>▶️ YouTube</h2>
                <p>Connect your YouTube account.</p>
                <button>Connect</button>
            </div>

        </div>
    </div>
<script>
function open2D() {
    alert("🎨 2D Image Creator coming soon!");
}
</script>

</body>
</html>
